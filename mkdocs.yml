site_name: Sistemas de Gestión Empresarial
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Inicio: index.md
  - UD2 - ERP/CRM:
      - Introducción: ud2/index.md
      - 1. Docker: ud2/docker.md
      - 2. Estructura: ud2/estructura.md
      - 3. Docker Compose: ud2/docker-compose.md
      - 4. Odoo.conf: ud2/odoo-conf.md
      - 5. Puesta en marcha: ud2/puesta-en-marcha.md
      - 6. Mantenimiento: ud2/mantenimiento.md
      - 7. Práctica: ud2/practica.md
      - 8. Salesforce: ud2/sales.md
  - UD3 - JasperReports:
      - Introducción: ud3/index.md
      - 1. Introducción a JasperReports: ud3/introduccion.md
      - 2. Instalación: ud3/instalacion.md
      - 3. Puesta en marcha: ud3/puesta-en-marcha.md
      - 4. Diseñador: ud3/disenador.md
      - 5. Base de datos: ud3/base-datos.md
      - 6. Conexión PostgreSQL: ud3/conexion-postgresql.md
      - 7. Primer informe: ud3/primer-informe.md
      - 8. Campos, parámetros y variables: ud3/campos-variables.md
      - 9. Agrupaciones y totales: ud3/agrupaciones.md
      - 10. Parámetros y filtros: ud3/parametros-filtros.md
      - 11. Expresiones: ud3/expresiones.md
      - 12. Gráficos: ud3/graficos.md
      - 13. Subinformes: ud3/subinformes.md
      - 14. Exportación: ud3/exportacion.md
      - 15. Integración con aplicaciones: ud3/integracion.md
      - 16. Práctica final: ud3/practica-final.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
